[project]
name = "ffmpeg-tools"
version = "0.1.0"
description = "Personal FFmpeg wrapper CLI for video conversion"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.scripts]
fftools = "ffmpeg_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffmpeg_tools"]
